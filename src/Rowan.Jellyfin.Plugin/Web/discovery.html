<div class="threepic-fin-discovery" role="region" aria-label="3pic Fin">
    <section class="threepic-fin-discovery__content">
        <div id="threepic-fin-discover-panel">
            <div class="threepic-fin-discovery__utilities" aria-label="3pic Fin tools">
                <button id="threepic-fin-downloads-tab" type="button" aria-label="Active downloads" title="Active downloads" aria-haspopup="dialog" aria-controls="threepic-fin-downloads-panel"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg></button>
                <button id="threepic-fin-calendar-tab" type="button" aria-label="Release calendar" title="Release calendar" aria-haspopup="dialog" aria-controls="threepic-fin-calendar-panel"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h3m-3 3h3"/></svg></button>
            </div>
            <form id="threepic-fin-search-form" role="search">
                <label for="threepic-fin-search">Search movies and TV</label>
                <div class="threepic-fin-discovery__search-controls">
                    <input id="threepic-fin-search" type="search" maxlength="200" autocomplete="off">
                    <button type="submit" class="threepic-fin-discovery__search-button" aria-label="Search" title="Search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
                </div>
            </form>
            <section aria-label="Search results"><h3 id="threepic-fin-search-heading" hidden>Search results</h3><div id="threepic-fin-search-results" class="threepic-fin-discovery__cards" aria-live="polite"></div>
                <div class="threepic-fin-discovery__pager"><button id="threepic-fin-search-prev" type="button" aria-label="Previous search results page" disabled>Previous</button><span id="threepic-fin-search-page" aria-live="polite"></span><button id="threepic-fin-search-next" type="button" aria-label="Next search results page" disabled>Next</button></div>
            </section>
            <section aria-label="My Requests"><h3>My Requests</h3><div id="threepic-fin-requests" class="threepic-fin-discovery__cards" aria-live="polite"></div>
                <div class="threepic-fin-discovery__pager" aria-label="My Requests pages"><button id="threepic-fin-requests-prev" type="button" aria-label="Previous requests page" disabled>Previous</button><span id="threepic-fin-requests-page" aria-live="polite"></span><button id="threepic-fin-requests-next" type="button" aria-label="Next requests page" disabled>Next</button></div>
            </section>
            <section aria-label="All Requests" hidden><h3>All Requests</h3>
                <div id="threepic-fin-shared-requests" class="threepic-fin-discovery__cards" aria-live="polite"></div>
                <div class="threepic-fin-discovery__pager" aria-label="All Requests pages"><button id="threepic-fin-shared-requests-prev" type="button" disabled>Previous</button><span id="threepic-fin-shared-requests-page" aria-live="polite"></span><button id="threepic-fin-shared-requests-next" type="button" disabled>Next</button></div>
            </section>
            <section aria-label="Trending"><h3>Trending</h3><div id="threepic-fin-trending" class="threepic-fin-discovery__cards" aria-live="polite"></div>
                <div class="threepic-fin-discovery__pager" aria-label="Trending pages"><button id="threepic-fin-trending-prev" type="button" aria-label="Previous Trending page" disabled>Previous</button><span id="threepic-fin-trending-page" aria-live="polite"></span><button id="threepic-fin-trending-next" type="button" aria-label="Next Trending page" disabled>Next</button></div>
            </section>
            <section aria-label="Popular Movies"><h3>Popular Movies</h3><div id="threepic-fin-movies" class="threepic-fin-discovery__cards" aria-live="polite"></div>
                <div class="threepic-fin-discovery__pager" aria-label="Movies pages"><button id="threepic-fin-movies-prev" type="button" aria-label="Previous movies page" disabled>Previous</button><span id="threepic-fin-movies-page" aria-live="polite"></span><button id="threepic-fin-movies-next" type="button" aria-label="Next movies page" disabled>Next</button></div>
            </section>
            <section aria-label="Popular TV"><h3>Popular TV</h3><div id="threepic-fin-tv" class="threepic-fin-discovery__cards" aria-live="polite"></div>
                <div class="threepic-fin-discovery__pager" aria-label="TV pages"><button id="threepic-fin-tv-prev" type="button" aria-label="Previous TV page" disabled>Previous</button><span id="threepic-fin-tv-page" aria-live="polite"></span><button id="threepic-fin-tv-next" type="button" aria-label="Next TV page" disabled>Next</button></div>
            </section>
            <section aria-label="Upcoming Movies"><h3>Upcoming Movies</h3><div id="threepic-fin-upcoming-movies" class="threepic-fin-discovery__cards" aria-live="polite"></div>
                <div class="threepic-fin-discovery__pager" aria-label="Upcoming Movies pages"><button id="threepic-fin-upcoming-movies-prev" type="button" aria-label="Previous Upcoming Movies page" disabled>Previous</button><span id="threepic-fin-upcoming-movies-page" aria-live="polite"></span><button id="threepic-fin-upcoming-movies-next" type="button" aria-label="Next Upcoming Movies page" disabled>Next</button></div>
            </section>
            <section aria-label="Upcoming TV"><h3>Upcoming TV</h3><div id="threepic-fin-upcoming-tv" class="threepic-fin-discovery__cards" aria-live="polite"></div>
                <div class="threepic-fin-discovery__pager" aria-label="Upcoming TV pages"><button id="threepic-fin-upcoming-tv-prev" type="button" aria-label="Previous Upcoming TV page" disabled>Previous</button><span id="threepic-fin-upcoming-tv-page" aria-live="polite"></span><button id="threepic-fin-upcoming-tv-next" type="button" aria-label="Next Upcoming TV page" disabled>Next</button></div>
            </section>
        </div>
        <dialog id="threepic-fin-downloads-panel" class="threepic-fin-discovery__dialog threepic-fin-discovery__activity" aria-labelledby="threepic-fin-downloads-title">
            <div class="threepic-fin-discovery__activity-header"><h3 id="threepic-fin-downloads-title">Active Downloads</h3><div class="threepic-fin-discovery__header-actions"><button id="threepic-fin-downloads-refresh" class="threepic-fin-discovery__icon-button threepic-fin-discovery__refresh" type="button" aria-label="Refresh downloads" title="Refresh downloads"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.1 6.9M20 4v7h-7"/></svg></button><button id="threepic-fin-downloads-close" class="threepic-fin-discovery__icon-button" type="button" aria-label="Close downloads" title="Close downloads"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div></div>
            <p id="threepic-fin-downloads-status" class="threepic-fin-discovery__refresh-status" role="status" aria-live="polite"></p>
            <section aria-label="Movie downloads"><h3>Movies</h3><div id="threepic-fin-downloads-radarr" class="threepic-fin-discovery__downloads" aria-live="polite"></div></section>
            <section aria-label="TV downloads"><h3>TV</h3><div id="threepic-fin-downloads-sonarr" class="threepic-fin-discovery__downloads" aria-live="polite"></div></section>
        </dialog>
        <dialog id="threepic-fin-calendar-panel" class="threepic-fin-discovery__dialog threepic-fin-discovery__activity" aria-labelledby="threepic-fin-calendar-title">
            <div class="threepic-fin-discovery__activity-header"><h3 id="threepic-fin-calendar-title">Release Calendar</h3><button id="threepic-fin-calendar-close" class="threepic-fin-discovery__icon-button" type="button" aria-label="Close calendar" title="Close calendar"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
            <div class="threepic-fin-discovery__calendar-toolbar">
                <div class="threepic-fin-discovery__switcher" role="group" aria-label="Calendar media type"><button id="threepic-fin-calendar-movies" type="button" aria-pressed="true">Movies</button><button id="threepic-fin-calendar-tv" type="button" aria-pressed="false">TV</button></div>
                <label id="threepic-fin-calendar-filter-wrap" class="threepic-fin-discovery__filter" for="threepic-fin-calendar-filter">Release type <select id="threepic-fin-calendar-filter"><option value="all">All types</option><option value="Cinema">Cinema</option><option value="Digital">Digital</option><option value="Physical">Physical</option></select></label>
                <div class="threepic-fin-discovery__date-controls"><label for="threepic-fin-calendar-date">From</label><input id="threepic-fin-calendar-date" type="date" aria-label="Calendar start date"><button id="threepic-fin-calendar-today" type="button">Today</button></div>
            </div>
            <div class="threepic-fin-discovery__calendar-navigation" aria-label="Calendar windows"><button id="threepic-fin-calendar-prev" type="button" aria-label="Previous 31 days" title="Previous 31 days"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><span id="threepic-fin-calendar-window" aria-live="polite"></span><button id="threepic-fin-calendar-next" type="button" aria-label="Next 31 days" title="Next 31 days"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button></div>
            <section id="threepic-fin-calendar-movies-section" aria-label="Movie calendar"><div id="threepic-fin-calendar-radarr" class="threepic-fin-discovery__calendar" aria-live="polite"></div></section>
            <section id="threepic-fin-calendar-tv-section" aria-label="TV calendar" hidden><div id="threepic-fin-calendar-sonarr" class="threepic-fin-discovery__calendar" aria-live="polite"></div></section>
        </dialog>
        <dialog id="threepic-fin-details-dialog" class="threepic-fin-discovery__dialog threepic-fin-discovery__details" aria-labelledby="threepic-fin-details-title" aria-describedby="threepic-fin-details-status">
            <button id="threepic-fin-details-close" class="threepic-fin-discovery__details-close" type="button" aria-label="Close details">×</button>
            <div id="threepic-fin-details-body"></div>
            <div class="threepic-fin-discovery__details-heading"><h3 id="threepic-fin-details-title"></h3><p id="threepic-fin-details-meta"></p></div>
            <p id="threepic-fin-details-overview" tabindex="0" aria-label="Synopsis"></p>
            <p id="threepic-fin-details-status" role="status" aria-live="polite"></p>
            <div class="threepic-fin-discovery__actions"><button id="threepic-fin-details-open" type="button" hidden>View in library</button><button id="threepic-fin-details-request" type="button" hidden>Request</button></div>
        </dialog>
        <dialog id="threepic-fin-request-dialog" class="threepic-fin-discovery__dialog" aria-labelledby="threepic-fin-request-title" aria-describedby="threepic-fin-request-status">
            <form id="threepic-fin-request-form">
                <div class="threepic-fin-discovery__request-heading"><div id="threepic-fin-request-art"></div><div><h3 id="threepic-fin-request-title">Request media</h3><p id="threepic-fin-request-meta"></p></div></div>
                <p id="threepic-fin-request-status" role="status" aria-live="polite"></p>
                <fieldset id="threepic-fin-request-seasons" hidden><legend>Select seasons to request</legend></fieldset>
                <label id="threepic-fin-request-4k-wrap" hidden><input id="threepic-fin-request-4k" type="checkbox"> Request in 4K</label>

                <div class="threepic-fin-discovery__actions"><button id="threepic-fin-request-submit" type="submit" disabled>Submit request</button><button id="threepic-fin-request-cancel" type="button">Close</button></div>
            </form>
        </dialog>
    </section>
</div>
