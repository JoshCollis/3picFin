name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test and build Release
        run: |
          dotnet restore RowanJellyfin.slnx
          dotnet test RowanJellyfin.slnx -c Release --no-restore
          dotnet build RowanJellyfin.slnx -c Release --no-restore
          node --test tests/Rowan.Jellyfin.Plugin.Tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate staged archive
        run: |
          python3 scripts/package_plugin.py package \
            --dll src/Rowan.Jellyfin.Plugin/bin/Release/net10.0/Rowan.Jellyfin.Plugin.dll \
            --manifest manifest.json --output dist --version 0.0.0.1 \
            --source-url https://example.invalid/releases/download/v0.0.0.1/3pic-fin_0.0.0.1.zip \
            --epoch 0 --changelog 'CI fixture only; not published'
